<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Profil GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Pencarian Profil GitHub</h2>
        
        <form id="search-form">
            <input type="text" id="username-input" placeholder="Masukkan username GitHub..." autocomplete="off">
            <button type="submit" id="search-btn">Cari</button>
        </form>

        <div id="loading" class="hidden">Sedang memuat data...</div>
        <div id="error-msg" class="hidden"></div>
        <div id="profile-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
